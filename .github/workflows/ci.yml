# .github/workflows/ci.yml
# El mismo robot de la Clase 18, ahora corriendo las pruebas E2E en cada push
# y publicando el reporte HTML de Playwright como artifact (descargable desde Actions).
name: E2E

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium   # el navegador, en la máquina de CI
      - run: npx playwright test                            # corre los E2E
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}                             # sube el reporte aunque falle
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
